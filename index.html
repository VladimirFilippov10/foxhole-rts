<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>War of the Continent — Deadlands</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100%; height: 100vh; overflow: hidden; background: #111827; font-family: 'Segoe UI', system-ui, sans-serif; color: white; user-select: none; }
        canvas { display: block; cursor: crosshair; }
        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; background: linear-gradient(135deg, #1f2937, #111827); }
        .screen.hidden { display: none; }
        .screen h1 { font-size: 3.5rem; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
        .screen .subtitle { color: #9ca3af; font-size: 1.1rem; margin-bottom: 2rem; }
        .faction-row { display: flex; gap: 2rem; margin-bottom: 2rem; }
        .faction-btn { width: 240px; height: 280px; border: 2px solid; border-radius: 12px; padding: 1.5rem; cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .faction-btn.wardens { background: linear-gradient(135deg, #1e3a5f, #1e40af); border-color: #3b82f6; }
        .faction-btn.colonials { background: linear-gradient(135deg, #5f1e1e, #b91c1c); border-color: #ef4444; }
        .faction-btn:hover { transform: scale(1.05); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .faction-btn .icon { font-size: 3.5rem; margin-bottom: 0.75rem; }
        .faction-btn h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .faction-btn p { font-size: 0.8rem; color: rgba(255,255,255,0.7); text-align: center; line-height: 1.4; }
        .hud-top { position: fixed; top: 0; left: 0; right: 0; padding: 0.5rem 1rem; background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .res-group { display: flex; gap: 1.2rem; }
        .res { display: flex; align-items: center; gap: 0.4rem; }
        .res-icon { font-size: 1.2rem; }
        .res-val { font-family: monospace; font-size: 0.9rem; }
        .res-lbl { font-size: 0.65rem; color: #9ca3af; }
        .faction-badge { padding: 0.3rem 0.8rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .faction-badge.wardens { background: rgba(30,58,95,0.8); color: #60a5fa; }
        .faction-badge.colonials { background: rgba(95,30,30,0.8); color: #f87171; }
        .sel-info { position: fixed; bottom: 1rem; left: 1rem; background: rgba(17,24,39,0.9); border: 1px solid #374151; border-radius: 8px; padding: 0.5rem 0.75rem; min-width: 180px; z-index: 100; }
        .sel-info p { font-size: 0.75rem; color: #d1d5db; }
        .sel-info .sel-type { font-size: 0.65rem; color: #9ca3af; }
        .notif { position: fixed; top: 4rem; left: 50%; transform: translateX(-50%); background: rgba(17,24,39,0.95); border: 1px solid #4b5563; border-radius: 8px; padding: 0.75rem 1.25rem; z-index: 200; font-size: 0.85rem; animation: fadeIn 0.3s; }
        .notif.hidden { display: none; }
        @keyframes fadeIn { from { opacity:0; transform:translateX(-50%) translateY(-8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
        .controls-hint { position: fixed; top: 3.5rem; right: 1rem; font-size: 0.65rem; color: #6b7280; text-align: right; line-height: 1.5; z-index: 100; }
        .mode-indicator { position: fixed; top: 3.5rem; left: 1rem; background: rgba(251,191,36,0.2); border: 1px solid #fbbf24; border-radius: 6px; padding: 0.3rem 0.7rem; font-size: 0.75rem; color: #fbbf24; z-index: 200; }
        .mode-indicator.hidden { display: none; }
        .factory-menu { position: fixed; background: rgba(17,24,39,0.95); border: 2px solid #4b5563; border-radius: 12px; padding: 1rem; z-index: 300; min-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .factory-menu.hidden { display: none; }
        .factory-menu h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #60a5fa; border-bottom: 1px solid #374151; padding-bottom: 0.5rem; }
        .factory-menu .close-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; color: #9ca3af; font-size: 1.5rem; cursor: pointer; }
        .factory-menu .close-btn:hover { color: white; }
        .unit-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
        .unit-card { background: rgba(31,41,55,0.8); border: 1px solid #374151; border-radius: 6px; padding: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .unit-card:hover:not(.disabled) { border-color: #60a5fa; background: rgba(31,41,55,1); transform: translateY(-2px); }
        .unit-card.disabled { opacity: 0.4; cursor: not-allowed; }
        .unit-card .unit-name { font-size: 0.75rem; font-weight: bold; margin-bottom: 0.25rem; }
        .unit-card .unit-stats { font-size: 0.6rem; color: #9ca3af; line-height: 1.3; }
        .unit-card .unit-cost { font-size: 0.6rem; color: #fbbf24; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div id="menuScreen" class="screen">
        <h1>⚔️ WAR OF THE CONTINENT</h1>
        <p class="subtitle">2D RTS в стиле Foxhole — Deadlands</p>
        <div class="faction-row">
            <button class="faction-btn wardens" onclick="selectFaction('wardens')">
                <div class="icon">🛡️</div><h2>WARDENS</h2>
                <p>Devitt • Gallagher 30mm • Niska APC<br>Тяжёлая бронетехника<br>Промышленное превосходство</p>
            </button>
            <button class="faction-btn colonials" onclick="selectFaction('colonials')">
                <div class="icon">⚔️</div><h2>COLONIALS</h2>
                <p>Hatchet • Falchion • Hoplite APC<br>Быстрые полугусеничники<br>Партизанская тактика</p>
            </button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="hudTop" class="hud-top" style="display:none;">
        <div class="res-group">
            <div class="res"><span class="res-icon">📦</span><span class="res-val" id="rSup">200</span><span class="res-lbl">SUP</span></div>
            <div class="res"><span class="res-icon">⚙️</span><span class="res-val" id="rComp">100</span><span class="res-lbl">COMP</span></div>
            <div class="res"><span class="res-icon">🪨</span><span class="res-val" id="rMat">80</span><span class="res-lbl">MAT</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:1rem;">
            <span style="font-family:monospace;font-size:0.8rem;color:#d1d5db;">Territories: <span id="tCount">1</span>/10</span>
            <span id="factionBadge" class="faction-badge wardens">🛡️ WARDENS</span>
        </div>
    </div>

    <div id="selInfo" class="sel-info" style="display:none;"></div>

    <div id="controlsHint" class="controls-hint" style="display:none;">
        WASD — камера<br>Клик — выбор<br>Двойной клик — перемещение<br>Клик на завод — меню производства<br>Клик по миникарте — перемещение камеры
    </div>

    <div id="modeIndicator" class="mode-indicator hidden">🎯 MOVE MODE</div>
    <div id="notif" class="notif hidden"></div>
    <div id="factoryMenu" class="factory-menu hidden">
        <button class="close-btn" onclick="closeFactoryMenu()">×</button>
        <h3>🏭 Производство</h3>
        <div id="unitGrid" class="unit-grid"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
